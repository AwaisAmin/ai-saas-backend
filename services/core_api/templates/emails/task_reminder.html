<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Reminder</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f4f5; padding: 40px 0"
    >
      <tr>
        <td align="center">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              background: #ffffff;
              border-radius: 12px;
              overflow: hidden;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background: linear-gradient(135deg, #f59e0b, #ef4444);
                  padding: 40px;
                  text-align: center;
                "
              >
                <h1
                  style="
                    color: #ffffff;
                    margin: 0;
                    font-size: 28px;
                    font-weight: 700;
                  "
                >
                  NexTask
                </h1>
                <p
                  style="
                    color: rgba(255, 255, 255, 0.85);
                    margin: 8px 0 0;
                    font-size: 15px;
                  "
                >
                  Task Due Tomorrow ⚠️
                </p>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 40px">
                <h2 style="color: #111827; font-size: 22px; margin: 0 0 12px">
                  Hi {{first_name}}! 👋
                </h2>
                <p
                  style="
                    color: #6b7280;
                    font-size: 15px;
                    line-height: 1.6;
                    margin: 0 0 24px;
                  "
                >
                  This is a friendly reminder that you have a task due
                  <strong>tomorrow</strong>.
                </p>

                <!-- Task Card -->
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="margin-bottom: 32px"
                >
                  <tr>
                    <td
                      style="
                        background: #fef3c7;
                        border-radius: 8px;
                        padding: 20px;
                        border-left: 4px solid #f59e0b;
                      "
                    >
                      <p
                        style="
                          margin: 0 0 8px;
                          font-size: 13px;
                          color: #92400e;
                          font-weight: 600;
                          text-transform: uppercase;
                          letter-spacing: 0.5px;
                        "
                      >
                        Task
                      </p>
                      <p
                        style="
                          margin: 0 0 12px;
                          font-weight: 700;
                          color: #111827;
                          font-size: 18px;
                        "
                      >
                        {{task_title}}
                      </p>
                      <p
                        style="margin: 0 0 4px; font-size: 13px; color: #6b7280"
                      >
                        📁 Project: <strong>{{project_name}}</strong>
                      </p>
                      <p style="margin: 0; font-size: 13px; color: #6b7280">
                        📅 Due Date: <strong>{{due_date}}</strong>
                      </p>
                    </td>
                  </tr>
                </table>

                <!-- CTA Button -->
                <table width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td align="center">
                      <a
                        href="http://localhost:3000"
                        style="
                          display: inline-block;
                          background: linear-gradient(135deg, #f59e0b, #ef4444);
                          color: #ffffff;
                          text-decoration: none;
                          padding: 14px 40px;
                          border-radius: 8px;
                          font-weight: 600;
                          font-size: 15px;
                        "
                      >
                        View Task →
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  background: #f9fafb;
                  padding: 24px 40px;
                  border-top: 1px solid #e5e7eb;
                  text-align: center;
                "
              >
                <p style="color: #9ca3af; font-size: 13px; margin: 0">
                  © 2026 NexTask. All rights reserved.<br />
                  You received this because you have a task due tomorrow.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
