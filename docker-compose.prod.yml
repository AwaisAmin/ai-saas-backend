services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_files:/app/staticfiles
    depends_on:
      - core_api
      - ai_service
    restart: always

  core_api:
    build:
      context: ./services/core_api
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - static_files:/app/staticfiles
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application -c gunicorn.conf.py"
    depends_on:
      - postgres
      - redis
    restart: always

  ai_service:
    build:
      context: ./services/ai_service
      dockerfile: Dockerfile
    expose:
      - "8001"
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 2
    restart: always

  celery:
    build:
      context: ./services/core_api
      dockerfile: Dockerfile
    env_file:
      - .env
    command: celery -A config worker --loglevel=info --concurrency=4
    depends_on:
      - postgres
      - redis
    restart: always

  celery_beat:
    build:
      context: ./services/core_api
      dockerfile: Dockerfile
    env_file:
      - .env
    command: celery -A config beat --loglevel=info
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    restart: always

  redis:
    image: redis:7-alpine
    restart: always

volumes:
  postgres_data:
  static_files:
